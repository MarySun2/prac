<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Card</title>
</head>
<body>
    <section class="vh-100">
        <div class="container py-5 h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
                <div class="col col-md-9 col-lg-7 col-xl-5">
                    <div class="card">
                        <div class="card-body p-4">
                            
                            <!-- content -->
                             <div class="d-flex">
                                <div class="flex-shrink-0">
                                    <!-- imagen -->
                                     <img class="mt-2" src="./img/user.png" alt="user.png" style="width: 180px;">
                                </div>

                                <div class="flex-grow-1">
                                    <!-- contenido -->
                                     <h5 class="mb-1 ms-3">Juan Perez</h5>
                                     <p class="mb-2 ms-2 pb-1">Senior</p>

                                     <div class="d-flex justify-content-center rounded-3 p-2 mb-3" style="background-color: #EEE;">
                                        <div>
                                            <p class="small text-body-secondary mb-1">Cursos</p>
                                            <p class="mb-0">15</p>
                                        </div>
    
                                        <div class="px-3">
                                            <p class="small text-body-secondary mb-1">Estudiantes</p>
                                            <p class="mb-0">4512</p>
                                        </div>
    
                                        <div>
                                            <p class="small text-body-secondary mb-1">Raiting</p>
                                            <p class="mb-0">8.5</p>
                                        </div>
                                     </div>

                                     <div class="d-flex">
                                        <button class="btn btn-outline-primary me-1 flex-grow-1 position-relative mt-3 ms-2">
                                            Mensaje
                                            <span class="ms-4 position-absolute top-0 start-0 translate-middle badge rounded-pill bg-danger">
                                                10
                                            </span>
                                        </button>
                                        <button class="btn btn-outline-primary me-1 flex-grow-1 position-relative mt-3 ms-2">
                                            Seguir
                                        </button>
                                     </div>

                                </div>

                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
        
    </section>
</body>
</html>
